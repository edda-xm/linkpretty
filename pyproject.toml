[project]
name = "linkpretty"
version = "1.1.0"
description = "macOS menubar app that converts copied URLs into rich, clickable links"
requires-python = ">=3.10"
dependencies = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
